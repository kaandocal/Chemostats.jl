name: Documentation

on:
  push:
    branches:
      - main # update to match your development branch (master, main, dev, trunk, ...)
    tags: '*'
    # Not evaluated for tags. The example pages are regenerated by Examples.yml.
    paths: [ 'docs/**', 'src/**', 'ext/**', 'Project.toml', '.github/workflows/Documentation.yml' ]
  pull_request:
    paths: [ 'docs/**', 'src/**', 'ext/**', 'Project.toml', '.github/workflows/Documentation.yml' ]

jobs:
  build:
    # These permissions are needed to:
    # - Deploy the documentation: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      # The example pages are normally generated nightly by Examples.yml
      - name: Generate missing example pages
        run: |
          missing=$(for name in growth_protein threshold_division; do [ -f docs/src/examples/$name.md ] || echo $name; done)
          [ -z "$missing" ] || julia --color=yes --threads=auto --project=docs docs/make_examples.jl $missing
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
